# Settings for the QGIS course page only (this folder).
toc: true
toc-location: left
toc-depth: 2
toc-title: "Contents"
number-sections: true
number-depth: 2
anchor-sections: true
smooth-scroll: true
bibliography: references.bib
link-citations: true
format:
  html:
    css: qgis-course.css
    grid:
      # symmetric grid, so that wide figures (.column-page) stay centered on the text column
      sidebar-width: 240px
      body-width: 760px
      margin-width: 240px
      gutter-width: 2rem

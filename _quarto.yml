project:
  type: website
  preview:
    port: 4200
  render:
    - "*.qmd"
    - "!drafts/"
  resources:
    - CNAME

author-meta: "Antimo Francese"
brand: _brand.yml

website:
  title: "Antimo Francese"
  site-url: "https://www.afrancese.com"
  description: "Antimo Francese — PhD student in Economics, University of Naples Parthenope. Economic history, long-run development, inequality."
  open-graph: true
  navbar:
    pinned: false
    search: false
    collapse: false
    right:
      - text: "Research"
        href: research/index.qmd
      - text: "Tools"
        href: tools/index.qmd
  page-footer:
    center: "&copy; 2026 Antimo Francese · Made with [Quarto](https://quarto.org/)"

format:
  html:
    theme: [brand, html/theme.scss]
    toc: false
    anchor-sections: false
    lang: en
    link-external-newwindow: true
    grid:
      body-width: 680px
      sidebar-width: 0px
      margin-width: 0px

execute:
  freeze: auto

<header id="title-block-header" class="quarto-title-block post-header">
  <h1 class="title">$title$</h1>
  <div class="post-meta">$if(subtitle)$$subtitle$$else$$if(date)$$date$$endif$$endif$$if(by-author)$ · $for(by-author)$$by-author.name.literal$$sep$, $endfor$$endif$</div>
  $if(pub-info.links)$
  <hr>
  <ul class="paper-links">
    $for(pub-info.links)$
    <li><a href="$pub-info.links.url$">$pub-info.links.name$</a></li>
    $endfor$
  </ul>
  $endif$
  <hr>
</header>

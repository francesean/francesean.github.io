<header id="title-block-header" class="quarto-title-block research default">
  <div class="page-title">
    <h1 class="title">$title$</h1>
    $if(subtitle)$
    <p class="page-subtitle">$subtitle$</p>
    $endif$
  </div>
  $if(pub-info.links)$
  <ul class="project-links">
    $for(pub-info.links)$
    <li class="project-link">
      <a href="$pub-info.links.url$">$if(pub-info.links.icon)$<i class="$pub-info.links.icon$"></i> $endif$$pub-info.links.name$</a>
    </li>
    $endfor$
  </ul>
  $endif$
</header>
